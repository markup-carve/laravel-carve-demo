name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Jobs carry an explicit timeout-minutes: without one GitHub applies a
# 360-minute default, long enough for a stalled job to go unnoticed.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Export static preview
        run: composer export-static
      - name: Check exported links
        run: php scripts/check-static-export.php dist /laravel-carve-demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
